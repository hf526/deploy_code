<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeployCode - 分支部署工具</title>
    <script>
      // 首帧前确定主题，避免闪烁
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("deploycode:theme") || "system";
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
