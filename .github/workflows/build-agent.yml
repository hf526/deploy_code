name: build-agent

# 控制机侧的 deploy-agent 是 Linux 二进制，这台 Windows 上没有交叉编译工具链，
# 所以借 GitHub Actions 出包：手动跑一次，下载产物解到 src-tauri/agent/deploy-agent，
# 再跑 build-installer.bat 就会打进安装包（见 src-tauri/agent/README.md）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 静态链接 musl 是为了不挑发行版：控制机可能是 Ubuntu / Debian / 阿里 TencentOS，
      # 跟着 glibc 版本走的产物会在某些机器上起不来。
      - name: Build
        run: cargo build -p deploy-agent --release --target x86_64-unknown-linux-musl

      - name: Check the binary is a static ELF
        run: file target/x86_64-unknown-linux-musl/release/deploy-agent | grep -q "statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-agent
          path: target/x86_64-unknown-linux-musl/release/deploy-agent
